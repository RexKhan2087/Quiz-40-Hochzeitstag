<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<h2>Gib das Lösungswort ein:</h2>
<input id="wort" type="text" />
<button onclick="check()">Weiter</button>
<p id="msg"></p>

<script>
function check(){
  const eingabe = document.getElementById('wort').value.trim().toLowerCase();

  if(eingabe === 'gemeinsam'){
    window.location.href = 'video.html';   // ← Weiterleitung auf deine Videoseite
  } else {
    document.getElementById('msg').innerText = 'Leider falsch.';
  }
}
</script>

</body>
</html>
