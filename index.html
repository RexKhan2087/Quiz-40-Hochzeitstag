<!DOCTYPE html>
<html>
<body>
<h2>Gib das Lösungswort ein:</h2>
<input id="wort" type="text" />
<button onclick="check()">Weiter</button>
<p id="msg"></p>
<script>
function check(){
  const eingabe = document.getElementById('wort').value.trim().toLowerCase();
  if(eingabe === 'gemeinsam'){ // dein Lösungswort
    window.location.href = 'https://www.dropbox.com/scl/fi/iq1dc49cvxcsy0pgi1qsd/Rubinhochzeit.mp4?rlkey=w66qtesz8eii48x6xphaqtpqp&st=m7bdq94v&dl=1';
  } else {
    document.getElementById('msg').innerText = 'Leider falsch.';
  }
}
</script>
</body>
</html>
